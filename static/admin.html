<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>omni-gen 配置管理</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #111827;
            --surface3: #0d1424;
            --border: #334155;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --accent: #667eea;
            --accent2: #764ba2;
            --success: #059669;
            --success2: #10b981;
            --danger: #dc2626;
            --warning: #f59e0b;
            --radius: 8px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ── Header ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.7rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-actions { display: flex; gap: 0.5rem; }

        /* ── Nav bar ── */
        .nav-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 49px;
            z-index: 40;
        }
        .nav-bar-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 0.35rem 0;
            list-style: none;
        }
        .nav-tab {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-dim);
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: transparent;
            transition: color 0.12s, background 0.12s;
            white-space: nowrap;
        }
        .nav-tab:hover { color: var(--text); background: var(--surface2); }
        .nav-tab.active { color: white; background: var(--accent); }
        .nav-tab .badge {
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(255,255,255,0.2);
            color: inherit;
            padding: 0 5px;
            border-radius: 8px;
            min-width: 18px;
            text-align: center;
        }
        .nav-tab:not(.active) .badge {
            background: var(--surface3);
            color: var(--text-dim);
        }

        /* ── Main ── */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.25rem 1.5rem 3rem;
        }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.45rem 0.75rem;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-dim); }
        .toolbar-meta { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }

        /* ── Config table ── */
        .config-table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .config-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            font-size: 0.82rem;
            min-width: 700px;
        }
        .config-table thead th {
            text-align: left;
            padding: 0.55rem 1rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            background: var(--surface3);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .config-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.1s;
        }
        .config-table tbody tr:last-child { border-bottom: none; }
        .config-table tbody tr:hover { background: rgba(102,126,234,0.04); }
        .config-table tbody tr.modified { background: rgba(245,158,11,0.04); }
        .config-table td { padding: 0.6rem 1rem; vertical-align: top; }

        .col-key    { width: 190px; }
        .col-default { width: 210px; }
        .col-value  { min-width: 260px; }
        .col-actions { width: 120px; }

        .key-name {
            font-family: 'Cascadia Code','Fira Code',monospace;
            font-size: 0.76rem;
            font-weight: 600;
            word-break: break-all;
        }
        .key-name.is-sensitive { color: var(--warning); }
        .key-desc {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 0.12rem;
        }

        /* default cell */
        .default-cell { font-size: 0; }
        .default-val {
            font-family: 'Cascadia Code','Fira Code',monospace;
            font-size: 0.72rem;
            color: var(--success2);
            word-break: break-all;
            max-height: 72px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }
        .default-val.missing { color: var(--text-dim); font-style: italic; -webkit-line-clamp: 2; }

        /* value cell */
        .value-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.74rem;
            font-family: 'Cascadia Code','Fira Code',monospace;
            padding: 0.4rem 0.55rem;
            resize: vertical;
            min-height: 38px;
            max-height: 180px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            white-space: pre-wrap;
            word-break: break-all;
            display: block;
            line-height: 1.6;
        }
        .value-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.18);
        }
        .value-input.is-prompt { min-height: 80px; }
        .value-input.is-masked {
            color: var(--text-dim);
            font-style: italic;
            cursor: not-allowed;
            background: var(--surface3);
        }
        .value-input.is-modified { border-color: var(--warning); }

        /* actions cell */
        .actions-cell { padding-top: 0.45rem; }
        .row-btns {
            display: flex;
            flex-direction: column;
            gap: 0.22rem;
            align-items: flex-end;
        }
        .btn-row { display: flex; gap: 0.22rem; }
        .modified-tag {
            display: none;
            font-size: 0.68rem;
            color: var(--warning);
            align-items: center;
            gap: 0.18rem;
            font-weight: 500;
        }
        .modified-tag.show { display: flex; }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.28rem;
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            border: 1.5px solid transparent;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.4;
            transition: all 0.15s ease;
            user-select: none;
            white-space: nowrap;
        }
        .btn svg { flex-shrink: 0; }

        /* Save — solid emerald, lifts on hover */
        .btn-save {
            background: #10b981;
            color: #fff;
            border-color: #059669;
            box-shadow: 0 2px 6px rgba(5,150,105,0.3);
        }
        .btn-save:hover {
            background: #34d399;
            border-color: #10b981;
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(16,185,129,0.4);
            color: #fff;
        }
        .btn-save:active {
            transform: translateY(0);
            box-shadow: 0 1px 3px rgba(5,150,105,0.2);
        }

        /* Reset — ghost with violet border, fills on hover */
        .btn-reset {
            background: transparent;
            color: #818cf8;
            border-color: #6366f1;
        }
        .btn-reset:hover {
            background: #6366f1;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99,102,241,0.35);
        }
        .btn-reset:active {
            transform: translateY(0);
        }

        /* Primary — purple gradient (Add card) */
        .btn-primary { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: white; border-color: transparent; }
        .btn-primary:hover { filter: brightness(1.15); box-shadow: 0 2px 10px rgba(102,126,234,0.5); transform: translateY(-1px); }

        .btn-logout {
            background: var(--surface);
            color: var(--text-dim);
            border-color: var(--border);
            font-size: 0.72rem;
        }
        .btn-logout:hover { color: var(--text); border-color: var(--text-dim); }

        /* ── Message ── */
        .message {
            padding: 0.6rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: none;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
        .message.show { display: block; }
        .message.success { background: rgba(5,150,105,0.15); border: 1px solid var(--success); color: #6ee7b7; }
        .message.error { background: rgba(220,38,38,0.15); border: 1px solid var(--danger); color: #fca5a5; }

        /* ── Empty ── */
        .empty { text-align: center; color: var(--text-dim); padding: 3rem 1rem; font-size: 0.88rem; }

        /* ── Add card ── */
        .add-card {
            margin-top: 2rem;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 1.1rem 1.5rem;
        }
        .add-card h2 { font-size: 0.84rem; color: var(--accent); margin-bottom: 0.7rem; font-weight: 600; }
        .add-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.55rem;
        }
        .add-grid .full { grid-column: 1 / -1; }
        @media (max-width: 640px) { .add-grid { grid-template-columns: 1fr 1fr; } }
        .add-grid label { display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.15rem; font-weight: 500; }
        .add-grid input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.8rem;
            padding: 0.4rem 0.6rem;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        .add-grid input:focus { outline: none; border-color: var(--accent); }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .config-table .col-default,
            .config-table thead th:nth-child(2),
            .config-table tbody td:nth-child(2) { display: none; }
        }
        @media (max-width: 600px) {
            .header-inner { padding: 0.6rem 1rem; }
            .main { padding: 1rem; }
            .nav-bar { top: 45px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1>omni-gen 配置管理</h1>
            <div class="header-actions">
                <button class="btn btn-logout" onclick="logout()">退出登录</button>
            </div>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="nav-bar-inner">
            <ul class="nav-tabs" id="nav-tabs"></ul>
        </div>
    </nav>

    <main class="main">
        <div id="message" class="message"></div>

        <div class="toolbar">
            <div class="search-box">
                <span style="color:var(--text-dim)">&#9906;</span>
                <input type="text" id="search-input" placeholder="搜索键名或描述..." oninput="onSearch()">
            </div>
            <span class="toolbar-meta" id="meta-label"></span>
        </div>

        <div class="config-table-wrap">
            <table class="config-table">
                <thead>
                    <tr>
                        <th class="col-key">键名</th>
                        <th class="col-default">默认值</th>
                        <th class="col-value">当前值</th>
                        <th class="col-actions">操作</th>
                    </tr>
                </thead>
                <tbody id="config-body"></tbody>
            </table>
        </div>
        <div class="empty" id="empty-msg" style="display:none">没有找到配置项</div>

        <div class="add-card">
            <h2>添加新配置</h2>
            <div class="add-grid">
                <div>
                    <label>键名</label>
                    <input type="text" id="new-key" placeholder="例如：MY_CONFIG">
                </div>
                <div>
                    <label>描述</label>
                    <input type="text" id="new-description" placeholder="配置项描述">
                </div>
                <div>
                    <label>分类</label>
                    <input type="text" id="new-category" placeholder="例如：Custom">
                </div>
                <div>
                    <label>配置值</label>
                    <input type="text" id="new-value" placeholder="配置值">
                </div>
                <div class="full">
                    <button class="btn btn-primary" onclick="addConfig()">添加配置</button>
                </div>
            </div>
        </div>
    </main>

    <script>
    (function() {
        'use strict';

        var TOKEN = (document.cookie.match(/admin_token=([^;]+)/) || [])[1]
                  || sessionStorage.getItem('admin_token') || '';

        var allConfigs = {};
        var defaults   = {};
        var currentTab = 'all';
        var searchText = '';

        /* ── Auth ── */
        function ah() { return { 'Authorization': 'Bearer ' + TOKEN }; }

        /* ── Key utilities ── */
        function isHash(val) {
            return /^[a-f0-9]{64}$/i.test(String(val || ''));
        }
        /* Mask value: show only first 3 + **** + last 3 chars */
        function maskVal(val) {
            var s = String(val || '');
            if (s.length <= 8) return '********';
            return s.slice(0, 3) + '••••' + s.slice(-3);
        }
        function isSensitive(key) {
            return /PASSWORD|SECRET|KEY|TOKEN|API_KEY|APIKEY|AUTH|CREDENTIAL|PRIVATE|ENCRYPT/i.test(key);
        }
        function isPrompt(key) { return /PROMPT$/i.test(key); }
        function normKey(key) { return key.toLowerCase().replace(/_/g, ''); }

        /* ── Value utilities ── */
        function ser(val) {
            if (val === null || val === undefined) return '';
            return typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val);
        }
        /* Convert literal \n / \t to real newlines/tabs for display in textarea */
        function displayVal(val) {
            if (val === null || val === undefined) return '';
            var s = typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val);
            return s.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
        }
        /* Escape for textarea content (no \n conversion — textarea handles real \n natively) */
        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* ── Case-insensitive default lookup ── */
        function findDef(key) {
            var n = normKey(key);
            for (var k in defaults) {
                if (normKey(k) === n) return k;
            }
            return undefined;
        }

        function normVal(v) {
            try { return JSON.stringify(JSON.parse(v)); } catch { return v; }
        }
        function isMod(key, val) {
            var def = defaults[findDef(key)];
            if (def === undefined) return false;
            /* Don't flag hash values (unchangeable system hashes) */
            if (isHash(val)) return false;
            /* Normalize literal \n to real newlines before comparing */
            return normVal(normNL(ser(val))) !== normVal(normNL(ser(def)));
        }
        /* Normalize literal \n \t in string values for comparison */
        function normNL(s) { return s.replace(/\\n/g, '\n').replace(/\\t/g, '\t'); }

        /* ── Format / escape ── */
        function fmtDef(val) {
            var s = ser(val);
            return s.length > 80 ? s.slice(0, 76) + '…' : s;
        }

        /* ── Message ── */
        function msg(text, type) {
            var el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type + ' show';
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.className = 'message'; }, 3500);
        }

        /* ── Load data ── */
        function load() {
            Promise.all([
                fetch('/api/v1/admin/config', { headers: ah() }),
                fetch('/api/v1/admin/defaults', { headers: ah() })
            ]).then(function(rs) {
                var p401 = false;
                rs.forEach(function(r) { if (r.status === 401) p401 = true; });
                if (p401) { window.location.href = '/admin/login'; return; }
                return Promise.all(rs.map(function(r) { return r.json(); }));
            }).then(function(data) {
                if (!data) return;
                allConfigs = data[0].config || {};
                defaults   = data[1].defaults || {};
                renderTabs();
                render();
            }).catch(function(e) { msg('加载失败: ' + e.message, 'error'); });
        }

        /* ── Nav tabs ── */
        function renderTabs() {
            var counts = {};
            Object.keys(allConfigs).forEach(function(k) {
                var cat = allConfigs[k].category || '未分类';
                counts[cat] = (counts[cat] || 0) + 1;
            });
            var cats = Object.keys(counts).sort(function(a, b) {
                if (a === 'Admin') return -1;
                if (b === 'Admin') return 1;
                return a.localeCompare(b, 'zh-CN');
            });
            var total = Object.keys(allConfigs).length;
            var html = '<li class="nav-tab' + (currentTab === 'all' ? ' active' : '') + '" onclick="setTab(\'all\')">'
                     + '全部 <span class="badge">' + total + '</span></li>';
            cats.forEach(function(cat) {
                html += '<li class="nav-tab' + (currentTab === cat ? ' active' : '') + '" onclick="setTab(\'' + cat.replace(/'/g, "\\'") + '\')">'
                      + esc(cat) + ' <span class="badge">' + counts[cat] + '</span></li>';
            });
            document.getElementById('nav-tabs').innerHTML = html;
        }

        window.setTab = function(tab) {
            currentTab = tab;
            renderTabs();
            render();
        };

        window.onSearch = function() {
            searchText = document.getElementById('search-input').value.trim().toLowerCase();
            render();
        };

        /* ── Render table ── */
        function render() {
            var rows = Object.keys(allConfigs).filter(function(key) {
                var cfg = allConfigs[key];
                var cat = cfg.category || '未分类';
                var st  = searchText;
                var matchTab = currentTab === 'all' || cat === currentTab;
                var matchS   = !st
                    || key.toLowerCase().indexOf(st) !== -1
                    || (cfg.description || '').toLowerCase().indexOf(st) !== -1
                    || ser(cfg.value).toLowerCase().indexOf(st) !== -1;
                return matchTab && matchS;
            });

            rows.sort(function(a, b) {
                if (a === 'ADMIN_PASSWORD') return -1;
                if (b === 'ADMIN_PASSWORD') return 1;
                return a.localeCompare(b);
            });

            document.getElementById('meta-label').textContent = '共 ' + rows.length + ' 项';
            document.getElementById('empty-msg').style.display = rows.length ? 'none' : 'block';
            document.querySelector('.config-table-wrap').style.display = rows.length ? 'block' : 'none';

            var tbody = document.getElementById('config-body');
            if (!rows.length) { tbody.innerHTML = ''; return; }

            tbody.innerHTML = rows.map(function(key) {
                var cfg   = allConfigs[key];
                var val   = cfg.value;
                var sens  = isSensitive(key);
                var isH   = isHash(val);
                /* Mask sensitive values that are either a hash or a real secret string */
                var mask  = sens && (isH || (typeof val === 'string' && val.length > 0 && !/^(true|false|\d+(\.\d+)?)$/i.test(val)));
                var prom  = isPrompt(key);
                var mod   = isMod(key, val);
                var defK  = findDef(key);
                var hasDef = defK !== undefined;
                var def   = hasDef ? defaults[defK] : undefined;

                var keyEsc  = esc(key);
                var valDisp = mask ? esc(maskVal(val)) : esc(displayVal(val));

                var rowCls   = mod ? 'modified' : '';
                var keyCls   = sens ? 'is-sensitive' : '';
                var inpCls   = 'value-input' + (prom ? ' is-prompt' : '') + (mask ? ' is-masked' : '') + (mod ? ' is-modified' : '');

                /* default cell */
                var defHtml;
                if (hasDef) {
                    defHtml = '<span class="default-val" title="默认值&#10;' + esc(ser(def)) + '">' + esc(fmtDef(def)) + '</span>';
                } else {
                    defHtml = '<span class="default-val missing">— 无默认值</span>';
                }

                /* actions cell */
                var acts;
                if (isH) {
                    acts = '<span style="font-size:0.7rem;color:var(--text-dim)">系统哈希不可编辑</span>';
                } else {
                    var tag = '<span class="modified-tag' + (mod ? ' show' : '') + '">&#9889; 已修改</span>';
                    var rst = hasDef
                        ? '<button class="btn btn-reset" onclick="resetV(\'' + keyEsc + '\')" title="恢复默认值">\
<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>\
重置</button>'
                        : '';
                    acts = '<div class="row-btns">' + tag + '<div class="btn-row">' + rst
                         + '<button class="btn btn-save" onclick="saveV(\'' + keyEsc + '\')">\
<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>\
保存</button></div></div>';
                }

                return '<tr class="' + rowCls + '">' +
                    '<td class="col-key">' +
                        '<div class="key-name ' + keyCls + '">' + esc(key) + '</div>' +
                        '<div class="key-desc">' + (cfg.description ? esc(cfg.description) : '') + '</div>' +
                    '</td>' +
                    '<td class="default-cell">' + defHtml + '</td>' +
                    '<td class="col-value">' +
                        '<textarea id="v-' + keyEsc + '" class="' + inpCls + '" spellcheck="false"' +
                        ' placeholder="' + esc(prom ? '支持多行，输入 JSON 可自动解析' : '输入配置值') + '"' +
                        '>' + valDisp + '</textarea>' +
                    '</td>' +
                    '<td class="col-actions actions-cell">' + acts + '</td>' +
                '</tr>';
            }).join('');
        }

        /* ── Save ── */
        window.saveV = function(key) {
            var raw = document.getElementById('v-' + key).value.trim();
            var val = raw ? (function() { try { return JSON.parse(raw); } catch { return raw; } })() : '';
            fetch('/api/v1/admin/config/' + encodeURIComponent(key), {
                method: 'PUT',
                headers: Object.assign({ 'Content-Type': 'application/json' }, ah()),
                body: JSON.stringify({ value: val })
            }).then(function(r) {
                if (r.status === 401) { window.location.href = '/admin/login'; return; }
                return r.json();
            }).then(function(d) {
                if (d && d.success) {
                    /* Store back with literal \n so isMod comparison stays consistent */
                    var stored = typeof val === 'string' ? val.replace(/\n/g, '\\n').replace(/\t/g, '\\t') : val;
                    allConfigs[key].value = stored;
                    var inp = document.getElementById('v-' + key);
                    if (inp) inp.classList.remove('is-modified');
                    var row = inp && inp.closest('tr');
                    if (row) { row.classList.remove('modified'); var t = row.querySelector('.modified-tag'); if (t) t.classList.remove('show'); }
                    msg('"' + key + '" 已保存', 'success');
                } else {
                    msg('保存失败', 'error');
                }
            }).catch(function(e) { msg('保存失败: ' + e.message, 'error'); });
        };

        /* ── Reset ── */
        window.resetV = function(key) {
            var defK = findDef(key);
            var def  = defaults[defK];
            if (def === undefined) return;
            var inp  = document.getElementById('v-' + key);
            if (!inp) return;
            /* Use displayVal so literal \n in defaults show as real newlines */
            inp.value = displayVal(def);
            inp.classList.add('is-modified');
            var row = inp.closest('tr');
            if (row) { row.classList.add('modified'); var t = row.querySelector('.modified-tag'); if (t) t.classList.add('show'); }
            msg('"' + key + '" 已恢复默认值，请点击保存', 'success');
        };

        /* ── Add ── */
        window.addConfig = function() {
            var key  = document.getElementById('new-key').value.trim();
            var vraw = document.getElementById('new-value').value.trim();
            var cat  = document.getElementById('new-category').value.trim();
            var desc = document.getElementById('new-description').value.trim();
            if (!key) { msg('请输入配置键名', 'error'); return; }
            var val;
            if (!vraw) { val = ''; }
            else { try { val = JSON.parse(vraw); } catch { val = vraw; } }
            fetch('/api/v1/admin/config', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, ah()),
                body: JSON.stringify({ key: key, value: val, category: cat, description: desc })
            }).then(function(r) {
                if (r.status === 401) { window.location.href = '/admin/login'; return; }
                return r.json();
            }).then(function(d) {
                if (d && d.success) {
                    allConfigs[key] = { value: val, category: cat, description: desc };
                    ['new-key','new-value','new-category','new-description'].forEach(function(id) {
                        document.getElementById(id).value = '';
                    });
                    renderTabs();
                    render();
                    msg('"' + key + '" 已添加', 'success');
                } else {
                    msg('添加失败', 'error');
                }
            }).catch(function(e) { msg('添加失败: ' + e.message, 'error'); });
        };

        /* ── Logout ── */
        window.logout = function() {
            document.cookie = 'admin_token=; Max-Age=0';
            sessionStorage.removeItem('admin_token');
            window.location.href = '/logout';
        };

        load();
    })();
    </script>
</body>
</html>
